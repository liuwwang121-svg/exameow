name: Build Gongkao Focus Android

on:
  push:
    branches: [gongkao-focus-android-v2]
    paths:
      - 'gongkao-focus/android-project.tar.gz.b64'
      - '.github/workflows/gongkao-focus-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode Android project
        run: |
          mkdir -p gongkao-focus/buildsrc
          base64 -d gongkao-focus/android-project.tar.gz.b64 > /tmp/android-project.tar.gz
          tar -xzf /tmp/android-project.tar.gz -C gongkao-focus/buildsrc
      - name: Unit test and build debug APK
        run: gradle -p gongkao-focus/buildsrc/android testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shangan-focus-debug-apk
          path: gongkao-focus/buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
